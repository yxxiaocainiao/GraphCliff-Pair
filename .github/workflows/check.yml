name: contracts
on: [push, pull_request]
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'torch>=2.7,<2.8' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python tools/fetch_fppool.py
      - run: python -m unittest discover -s tests -v
