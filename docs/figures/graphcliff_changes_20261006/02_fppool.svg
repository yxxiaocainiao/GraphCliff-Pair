   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="44.98395" transform="rotate(-0 36.1692 44.98395)">02｜FPPool：改Pool，不改GraphCliff Filter</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="80.778366" transform="rotate(-0 36.1692 80.778366)">直接替换与残差分支是两个已试方案；不是同一个模型同时采用两种读出。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="599.673525" transform="rotate(-0 36.1692 599.673525)">FPPool使用编码节点与结构指纹归属；残差分支在SAG前读完整节点。两方案均未建立通用优势。</text>
   </g>
