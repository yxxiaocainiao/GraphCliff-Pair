   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="80.778366" transform="rotate(-0 36.1692 80.778366)">每层Q/R同步：ShortGINE → 拆成x₁、x₂、v → x₂跨分子交互 → 原门控/残差融合。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="599.666963" transform="rotate(-0 36.1692 599.666963)">这是另一组单seed替换试验；保留SHORT、门控与读出，还引入交互归一化等变化，非纯注意力消融。</text>
   </g>
