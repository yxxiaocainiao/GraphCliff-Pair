   <g id="text_2">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="80.771335" transform="rotate(-0 36.1692 80.771335)">以下是三类独立实验；并未把全部Loss同时叠进同一最终模型。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="599.673525" transform="rotate(-0 36.1692 599.673525)">橙色标签/损失分支仅训练时使用。动态＝epoch调度；不是预测误差自适应或元学习权重。</text>
