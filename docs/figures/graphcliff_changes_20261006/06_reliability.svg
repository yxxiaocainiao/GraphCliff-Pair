   </g>
   <g id="text_8">
    <text style="font-size: 16px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #b65b12" x="798.9966" y="207.572356" transform="rotate(-0 798.9966 207.572356)">风险RF → r(x)</text>
   </g>
