   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="45.00645" transform="rotate(-0 36.1692 45.00645)">06｜后期方向：固定Chemprop，改预测可靠性</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="80.742038" transform="rotate(-0 36.1692 80.742038)">这不是在GraphCliff Filter中再加一层；主干已转为成熟Chemprop，点预测不随风险方法改变。</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #253546" x="36.1692" y="599.666963" transform="rotate(-0 36.1692 599.666963)">组件均衡已停止；图中灰虚线是尚未确定的新核心。已有风险收益不能直接称活性预测涨点或算法创新。</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #78848d" x="36.1692" y="628.272588" transform="rotate(-0 36.1692 628.272588)">颜色：蓝＝沿用   橙＝新增/替换   灰＋删除线＝被替换   灰虚线＝未定方案</text>
   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: middle; fill: #29628e" x="91.0809" y="207.682356" transform="rotate(-0 91.0809 207.682356)">查询结构</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #29628e" transform="translate(190.97165 198.717044)">Chemprop D-MPNN</text>
    <text style="font-size: 16px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #29628e" transform="translate(222.5704 216.209544)">固定点预测 ŷ</text>
   </g>
   <g id="text_7">
